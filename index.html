<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal Refleksi Hati · 7 Hari Merapikan Hati</title>
<meta name="description" content="Jurnal refleksi 7 hari untuk merapikan hati, sesuai kondisimu: patah hati, sedih, kecewa, takut, introvert, pemalu, kesepian, kemarahan, kelelahan, rendah diri, penyesalan, kehilangan & duka, atau kebingungan arah. Tersimpan di perangkatmu.">
<meta name="theme-color" content="#efe0d8">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="Jurnal Hati">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurnal Hati">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<noscript><style>body{opacity:1!important}</style></noscript>
<script>/* pasang tema sebelum halaman tampil, supaya tidak berkedip */
(function(){var g='her',m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
try{var t=JSON.parse(localStorage.getItem('jurnal-theme'));if(t){g=t.g==='him'?'him':'her';m=t.m==='dark'?'dark':'light';}}catch(e){}
document.documentElement.setAttribute('data-theme',g+'-'+m);})();
</script>
<link rel="stylesheet" href="style.css?v=6">
<body>

<!-- Goresan kuas (dipakai di sampul dan halaman) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <symbol id="brushTR" viewBox="0 0 200 200">
      <g filter="url(#rough)" fill="none" stroke-linecap="round">
        <path d="M70 -8 C 130 4, 178 56, 206 132" style="stroke:var(--b1)" stroke-width="46" opacity=".5"/>
        <path d="M92 -4 C 138 10, 176 44, 204 96" style="stroke:var(--b2)" stroke-width="10" opacity=".4"/>
        <path d="M60 4 C 120 16, 168 70, 200 150" style="stroke:var(--b3)" stroke-width="3" opacity=".7"/>
        <path d="M78 -2 C 132 12, 182 62, 204 118" style="stroke:var(--b2)" stroke-width="2" opacity=".35"/>
      </g>
    </symbol>
  <symbol id="ornHer" viewBox="0 0 64 26"><path d="M3 13h20M41 13h20"/><g transform="translate(32 13)"><ellipse rx="2.6" ry="5.4" cy="-5.4"/><ellipse rx="2.6" ry="5.4" cy="-5.4" transform="rotate(72)"/><ellipse rx="2.6" ry="5.4" cy="-5.4" transform="rotate(144)"/><ellipse rx="2.6" ry="5.4" cy="-5.4" transform="rotate(216)"/><ellipse rx="2.6" ry="5.4" cy="-5.4" transform="rotate(288)"/><circle r="1.3"/></g></symbol>
    <symbol id="ornHim" viewBox="0 0 64 26"><path d="M3 13h17M44 13h17"/><path d="M22 13C27 6 37 6 42 13 37 20 27 20 22 13Z"/><path d="M26 13h12"/></symbol>
  </defs>
</svg>

<div class="theme-switch" id="themeSwitch" role="group" aria-label="Tema tampilan">
  <button type="button" id="btnGender" aria-label="Ganti tema warna">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.8 17 3 12 3z"/><circle class="pd" cx="7.5" cy="11" r="1.1"/><circle class="pd" cx="10.5" cy="7.3" r="1.1"/><circle class="pd" cx="15" cy="7.8" r="1.1"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="btnMode" aria-label="Ganti mode gelap atau terang">
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<main class="stage" id="stage">
  <div class="book closed" id="book">
    <div class="slot left empty" id="slotL"></div>
    <div class="slot right" id="slotR"></div>

    <!-- Sampul -->
    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Buka jurnal">
      <div class="face front">
        <svg class="brush tr" aria-hidden="true"><use href="#brushTR"/></svg>
        <svg class="brush bl" aria-hidden="true"><use href="#brushTR"/></svg>
        <div class="frame"></div>
        <div class="cover-inner">
          <div class="eyebrow">7 hari · satu halaman per hari</div>
          <h1 class="cover-title">Jurnal<br>Refleksi Hati</h1>
          <svg class="orn orn-her" aria-hidden="true"><use href="#ornHer"/></svg><svg class="orn orn-him" aria-hidden="true"><use href="#ornHim"/></svg>
          <div class="cover-sub">Ikhtiar merawat dan memulihkan hati</div>
          <p class="cover-quote">Hati yang berani jujur pada dirinya sedang dalam perjalanan menemukan ‘Rumah’.</p>
          <div class="cover-brand">kurniapedia</div>
        </div>
      </div>
      <div class="face back" id="coverBack">
        <div class="eyebrow">Jurnal ini milik</div>
        <input class="line-input owner" id="owner" type="text" maxlength="60" autocomplete="name" data-k="name" placeholder="Tulis namamu…" aria-label="Jurnal ini milik">
        <div class="divider"></div>
      </div>
    </div>

    <!-- Lembar yang sedang dibalik -->
    <div class="leaf" id="leaf">
      <div class="face front" id="leafF"></div>
      <div class="face back" id="leafB"></div>
    </div>
  </div>

  <div class="controls">
    <div class="cta" id="cta">
      <button class="btn primary" id="btnOpen" type="button">Buka jurnal</button>
      <button class="btn" id="btnResume" type="button" hidden>Lanjutkan menulis</button>
    </div>
    <div class="nav" id="nav" hidden>
      <button class="round" id="btnPrev" type="button" aria-label="Halaman sebelumnya">‹</button>
      <button class="btn" id="btnToc" type="button">Daftar isi</button>
      <span class="pos" id="pos"></span>
      <button class="btn" id="btnClose" type="button">Tutup</button>
      <button class="round" id="btnNext" type="button" aria-label="Halaman berikutnya">›</button>
    </div>
    <div class="toc" id="toc" hidden></div>
    <div class="prog" id="prog" hidden><div class="segs" id="progSegs"></div><span id="progTxt"></span></div>
  </div>
</main>

<div class="rot-msg" id="rotMsg" role="alert">
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="36" rx="4"/><path d="M22 37h4"/><path d="M6 24a18 18 0 0 1 4-10M10 14l-1-5M10 14l5 0" /></svg>
  <b>Putar HP ke posisi tegak</b>
  <span>Jurnal ini dirancang untuk mode potret di HP.</span>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="printRoot" aria-hidden="true"></div>

<script src="content.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>

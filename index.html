<main class="stage" id="stage">
  <div class="book closed" id="book">
    <div class="slot left empty" id="slotL"></div>
    <div class="slot right" id="slotR"></div>

    <!-- Sampul -->
    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Buka jurnal">
      <div class="face front">
        <svg class="brush tr" aria-hidden="true"><use href="#brushTR"/></svg>
        <svg class="brush bl" aria-hidden="true"><use href="#brushTR"/></svg>
        <div class="frame"></div>
        <div class="cover-inner">
          <div class="eyebrow">7 hari · satu halaman per hari</div>
          <h1 class="cover-title">Jurnal<br>Refleksi Hati</h1>
          <svg class="orn orn-her" aria-hidden="true"><use href="#ornHer"/></svg><svg class="orn orn-him" aria-hidden="true"><use href="#ornHim"/></svg>
          <div class="cover-sub">Ikhtiar merawat dan memulihkan hati</div>
          <p class="cover-quote">Hati yang berani jujur pada dirinya sedang dalam perjalanan menemukan ‘Rumah’.</p>
          <div class="cover-brand">kurniapedia</div>
        </div>
      </div>
      <div class="face back" id="coverBack">
        <div class="eyebrow">Jurnal ini milik</div>
        <input class="line-input owner" id="owner" type="text" maxlength="60" autocomplete="name" data-k="name" placeholder="Tulis namamu…" aria-label="Jurnal ini milik">
        <div class="divider"></div>
      </div>
    </div>

    <!-- Lembar yang sedang dibalik -->
    <div class="leaf" id="leaf">
      <div class="face front" id="leafF"></div>
      <div class="face back" id="leafB"></div>
    </div>
  </div>

  <div class="controls">
    <div class="cta" id="cta">
      <button class="btn primary" id="btnOpen" type="button">Buka jurnal</button>
      <button class="btn" id="btnResume" type="button" hidden>Lanjutkan menulis</button>
    </div>
    <div class="nav" id="nav" hidden>
      <button class="round" id="btnPrev" type="button" aria-label="Halaman sebelumnya">‹</button>
      <button class="btn" id="btnToc" type="button">Daftar isi</button>
      <span class="pos" id="pos"></span>
      <button class="btn" id="btnClose" type="button">Tutup</button>
      <button class="round" id="btnNext" type="button" aria-label="Halaman berikutnya">›</button>
    </div>
    <div class="toc" id="toc" hidden></div>
    <div class="prog" id="prog" hidden><div class="segs" id="progSegs"></div><span id="progTxt"></span></div>
  </div>
</main>
